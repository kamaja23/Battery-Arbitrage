[project]
name = "battery-arbitrage"
version = "0.1.0"
description = "ERCOT battery arbitrage simulator and backtester"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "ercot>=0.1.2",
    "plotly>=6",
    "pulp>=2.8,<3",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "python-dotenv>=1.0"]

[project.scripts]
arb = "arb.cli:main"
arb-backtest = "arb.cli:backtest_main"
arb-verify-data = "arb.cli:verify_main"
arb-fetch = "arb.cli:fetch_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
