[project]
name = "wattson"
version = "0.1.0"
description = "Wattson: backtests Base home batteries against real ERCOT prices"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "ercot>=0.1.2",
    "plotly>=6",
    "pulp>=2.8,<3",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "python-dotenv>=1.0"]

[project.scripts]
wattson = "wattson.cli:main"
wattson-backtest = "wattson.cli:backtest_main"
wattson-verify-data = "wattson.cli:verify_main"
wattson-fetch = "wattson.cli:fetch_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wattson"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
